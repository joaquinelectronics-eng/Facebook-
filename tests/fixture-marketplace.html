<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Marketplace (replica de prueba)</title>
<style>body{margin:0;font-family:sans-serif;background:#fff}
.x1n2onr6{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.x9f619 img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}
.xjbqb8w{font-weight:700}</style></head>
<body>
<div id="raiz">
  <div class="x78zum5 xdt5ytf">
    <!-- Grilla de resultados. Las clases imitan las ofuscadas reales de
         Facebook a proposito: el scraper NO debe depender de ninguna.
         La fila de abajo copia el formato real: "Usado - Olivos, BA" y
         "128 mil km - Ciudad de Buenos Aires", con el separador que usa
         Facebook. -->
    <div class="x1n2onr6" id="grilla"></div>
  </div>
</div>
<script>
const items = [
  // titulo, precio, fila de estado/kilometraje/zona
  {id:'101', t:'Audi A5 2.0 TFSI Quattro 2018', p:'US$ 23.500',   m:'Usado · Olivos, BA'},
  {id:'102', t:'Audi A4 2.0 TFSI 2017',         p:'US$ 21.000',   m:'Usado · Martínez, BA'},
  {id:'103', t:'Audi A3 Sportback 2016',        p:'US$ 18.000',   m:'Usado · Rosario, Santa Fe'},
  {id:'104', t:'Audi A5 Coupe 2015',            p:'US$ 12.000',   m:'Usado · Santa Fe, SF'},
  {id:'105', t:'Audi A5 Sportback 2020',        p:'US$ 45.000',   m:'Usado · Ciudad de Buenos Aires, CF'},
  {id:'106', t:'AUDI A 5 impecable 2019',       p:'$ 24.500',     m:'128 mil km · Ciudad de Buenos Aires'},
  {id:'107', t:'Volkswagen Vento 2.0 2018',     p:'US$ 20.000',   m:'Usado · Olivos, BA'},
  {id:'108', t:'Audi A5 2019 full',             p:'$ 28.000.000', m:'Usado · Funes, SF'},
  {id:'109', t:'Audi A50 raro',                 p:'US$ 20.000',   m:'Usado · Palermo'},
  {id:'110', t:'Audi A5 2018 permuto menor',    p:'US$ 22.000',   m:'Usado · Tigre, BA'},
  // precios abreviados y rellenos
  {id:'111', t:'Audi A5 2017 impecable',        p:'$ 22',         m:'90 mil km · Paraná, ER'},
  {id:'112', t:'Audi A5 2018 titular unico',    p:'$1',           m:'Usado · La Plata, BA'},
  {id:'113', t:'Audi A5 2016 barato',           p:'$ 13',         m:'Usado · Santa Rosa, La Pampa'},
  {id:'114', t:'Audi A5 2020 full',             p:'26 palos',     m:'Usado · Rosario, SF'},
  // zonas de mas lejos, que hay que descartar
  {id:'115', t:'Audi A5 2018 impecable',        p:'US$ 24.000',   m:'Usado · Villa Carlos Paz'},
  {id:'116', t:'Audi A5 2019 nafta',            p:'US$ 25.000',   m:'Usado · Mendoza, MZ'},
  // localidad que no esta en la lista: no se descarta, se muestra igual
  {id:'117', t:'Audi A5 2018 unico',            p:'US$ 26.000',   m:'Usado · Pueblito Perdido'},
  // Bajadas de precio: Facebook muestra el precio viejo tachado al lado.
  {id:'118', t:'Audi A5 2016 full',             p:'US$ 19.000',   p2:'US$ 23.000', m:'Usado · Villa Ballester, BA'},
  {id:'119', t:'Audi A5 2019 impecable',        p:'US$ 27.000',   p2:'US$ 29.500', m:'Usado · Punta Alta, BA'},
  /* Los dos casos que rompian la lectura del titulo:
     - foto sin cargar (no hay alt) y el texto partido en pedazos
     - foto cargada, pero el titulo del texto partido con la zona pegada */
  {id:'120', t:'Audi A5 Sportback 2.0t',        p:'US$ 25.000',   m:'Usado · Tigre, BA', sinFoto: true, partido: true},
  {id:'121', t:'2017 Audi a5 2.0 t fsi quattro',p:'US$ 28.500',   m:'Usado · Nordelta, BA', partido: true}
];
/* ?n=3000 repite los avisos hasta llegar a esa cantidad, para medir como se
   comporta la extension con una busqueda larga de verdad. */
const cuantos = Number(new URLSearchParams(location.search).get('n')) || items.length;
const lista = [];
for (let i = 0; lista.length < cuantos; i++) {
  const base = items[i % items.length];
  lista.push(i < items.length ? base
    : Object.assign({}, base, { id: String(1000 + i) }));
}
const grilla = document.getElementById('grilla');
for (const it of lista) {
  // Anidamiento profundo, como el real: celda > wrapper > wrapper > <a>
  const celda = document.createElement('div');
  celda.className = 'x9f619 x1n2onr6 x1ja2u2z';
  celda.innerHTML =
    '<div class="x1lliihq"><div class="x78zum5">' +
      '<a href="/marketplace/item/' + it.id + '/?ref=search&referral_code=null" class="x1i10hfl">' +
        '<div class="xt7dq6l">' +
          // Facebook arma el alt como "Titulo en Ciudad, Provincia".
          (it.sinFoto ? '' :
            '<img alt="' + it.t + ' en ' + it.m.split('\u00b7').pop().trim() +
            '" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">') +
          '<div class="xjbqb8w"><span>' + it.p + '</span>' +
            (it.p2 ? '<span style="text-decoration:line-through;color:#888"> ' + it.p2 + '</span>' : '') +
          '</div>' +
          (it.partido
            ? '<div class="x1lliihq"><span><span>' + it.t + '</span>' +
              '<span> en ' + it.m.split('\u00b7').pop().trim() + '</span></span></div>'
            : '<div class="x1lliihq"><span>' + it.t + '</span></div>' +
              '<div class="x1lliihq"><span>' + it.m + '</span></div>') +
        '</div>' +
      '</a>' +
    '</div></div>';
  grilla.appendChild(celda);
}
</script>
</body></html>
